services:
    app:
        image: ghcr.io/Haniawatah/dv1677-ht26-grupp2-backend:latest
        container_name: dv1677-ht26-grupp2-backend
        ports:
            - "3000:3000"
        environment:
            - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
            - DATABASE_NAME=jsramverk
        depends_on:
            - mongodb
        restart: always

    # backend:
    #     build: .
    #     ports:
    #         - "${PORT:-3000}:3000"
    #     environment:
    #         PORT: 3000
    #         MONGODB_URI: mongodb://root:secret@mongodb:27017/
    #         DB_NAME: jsramverk
    #     depends_on:
    #         - mongodb
    #     restart: unless-stopped

    mongodb:
        image: mongo:latest
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: secret
        volumes:
            - mongodbdata:/data/db

volumes:
    mongodbdata:
